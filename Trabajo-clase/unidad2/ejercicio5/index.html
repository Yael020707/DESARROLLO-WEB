<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="practica 5">
  <meta name="author" content="Kevin Yael Barron Arce">
  <title>Clase121026</title>
  <link rel="stylesheet" href="Style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="dashboard" id="mainDashboard">
    <header class="header">
      <h1 id="mainTitle">sitios web</h1>
      <button id="changeBtn" class="btn-change">Cambiar</button>
    </header>

    <section class="grid-top">
      <!-- Título 1 -->
      <article class="card card-hover-change-img">
        <h2 class="card-title">HTML</h2>
        <div class="img-container">
          <img src="../ejercicio5/img/images.png" alt="Imagen 1" class="img-default">
          <img src="../ejercicio5/img/html2.png" alt="Imagen Alt" class="img-hover">
        </div>
      </article>

      <!-- Título 2 -->
      <article class="card card-hover-rotate">
        <h2 class="card-title">CSS</h2>
        <div class="img-container">
          <img src="../ejercicio5/img/css.png" alt="Imagen 2" class="img-rotate">
        </div>
      </article>
    </section>

    <section class="grid-bottom">
      <!-- Título 3 -->
      <article class="card card-hover-zoom">
        <h2 class="card-title">JavaScript</h2>
        <div class="img-container overflow-hidden">
          <img src="../ejercicio5/img/js.png" alt="Imagen 3" class="img-zoom">
        </div>
      </article>

      <!-- Título 4 -->
      <article class="card card-hover-border">
        <h2 class="card-title">git</h2>
        <div class="img-container">
          <img src="../ejercicio5/img/git.png" alt="Imagen 4">
        </div>
      </article>

      <!-- Título 5 -->
      <article class="card">
        <h2 class="card-title">vscode</h2>
        <div class="img-container">
          <img src="../ejercicio5/img/vscode.png" alt="Imagen 5">
        </div>
      </article>
    </section>
  </main>

  <script src="../ejercicio5/funtion.js"></script>
</body>
</html>
